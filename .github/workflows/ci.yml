name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bkp_ci
          POSTGRES_USER: bkp_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bkp_ci -d bkp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BKP_DATABASE_URL: postgresql+psycopg://bkp_ci:ci_only_password@localhost:5432/bkp_ci
      BKP_TEST_POSTGRES_URL: postgresql+psycopg://bkp_ci:ci_only_password@localhost:5432/bkp_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check app tests migrations
      - run: python -m ruff format --check app tests migrations
      - run: python -m mypy app
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
